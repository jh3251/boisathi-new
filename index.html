    <!-- Fix for 'Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter' -->
    <script>
      (function() {
        const originalParse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (text === 'undefined' || text === undefined) return null;
          try {
            return originalParse.call(this, text, reviver);
          } catch (e) {
            console.error('JSON.parse failed on:', text);
            return null; // Fallback to null to prevent crash
          }
        };
      })();
    </script>
    <script>
      try {
        const localKeys = Object.keys(localStorage);
        for (const key of localKeys) {
          if (localStorage.getItem(key) === 'undefined') {
            localStorage.removeItem(key);
          }
        }
        const sessionKeys = Object.keys(sessionStorage);
        for (const key of sessionKeys) {
          if (sessionStorage.getItem(key) === 'undefined') {
            sessionStorage.removeItem(key);
          }
        }
      } catch (e) {}
    </script>
    <script>
      (function() {
        try {
          const originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return originalFetch;
            },
            set(val) {
              // Ignored attempt to overwrite read-only window.fetch getter
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.error('Failed to configure window.fetch setter:', e);
        }
      })();
    </script>
